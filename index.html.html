<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad 訂購分流系統 ver 1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .marquee-container { overflow: hidden; white-space: nowrap; background: #fee2e2; padding: 10px; color: #b91c1c; font-weight: bold; font-size: 1.5rem; }
        .marquee-text { display: inline-block; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        .modal-bg { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-gray-100 h-screen font-sans">

    <!-- 登入與選擇面板 -->
    <div id="login-view" class="flex flex-col items-center justify-center h-full">
        <div class="bg-white p-8 rounded-xl shadow-lg text-center w-96">
            <h1 class="text-2xl font-bold mb-6 text-blue-800">iPad 訂購分流系統 <span class="text-sm text-gray-500">ver 1.3</span></h1>
            
            <label class="block text-left font-bold mb-2">1. 請選擇日期：</label>
            <select id="date-select" class="w-full p-3 border rounded mb-6 text-lg">
                <option value="day1">第一天 (17/9)</option>
                <option value="day2">第二天 (18/9)</option>
            </select>

            <label class="block text-left font-bold mb-2">2. 請選擇身份版面：</label>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="enterSystem('display')" class="bg-blue-500 text-white p-3 rounded hover:bg-blue-600">📺 大螢幕版</button>
                <button onclick="enterSystem('reception')" class="bg-green-500 text-white p-3 rounded hover:bg-green-600">📝 簽到處</button>
                <button onclick="enterSystem('counter', 'A')" class="bg-purple-500 text-white p-3 rounded hover:bg-purple-600">櫃檯 A</button>
                <button onclick="enterSystem('counter', 'B')" class="bg-purple-500 text-white p-3 rounded hover:bg-purple-600">櫃檯 B</button>
                <button onclick="enterSystem('counter', 'C')" class="bg-purple-500 text-white p-3 rounded hover:bg-purple-600">櫃檯 C</button>
                <button onclick="enterSystem('admin')" class="bg-gray-800 text-white p-3 rounded hover:bg-gray-900">⚙️ 後台管理</button>
            </div>
        </div>
    </div>

    <!-- 📺 大螢幕版 -->
    <div id="display-view" class="hidden h-full flex flex-col">
        <div class="bg-blue-800 text-white p-4 text-center text-3xl font-bold flex justify-between items-center">
            <span>iPad 訂購叫號系統</span>
            <div>
                <button onclick="testAudio()" class="text-sm bg-blue-600 px-3 py-1 rounded hover:bg-blue-500 mr-4 border border-blue-400">🔊 測試廣播</button>
                <span class="sys-date-label"></span>
            </div>
        </div>
        <div class="flex-1 flex p-4 gap-4">
            <div class="flex-1 bg-white rounded-xl shadow-lg border-4 border-purple-500 flex flex-col items-center justify-center">
                <h2 class="text-5xl font-bold text-purple-600 mb-8">櫃檯 A</h2>
                <div id="display-counter-A" class="text-[10rem] leading-none font-black text-gray-800">--</div>
            </div>
            <div class="flex-1 bg-white rounded-xl shadow-lg border-4 border-purple-500 flex flex-col items-center justify-center">
                <h2 class="text-5xl font-bold text-purple-600 mb-8">櫃檯 B</h2>
                <div id="display-counter-B" class="text-[10rem] leading-none font-black text-gray-800">--</div>
            </div>
            <div class="flex-1 bg-white rounded-xl shadow-lg border-4 border-purple-500 flex flex-col items-center justify-center">
                <h2 class="text-5xl font-bold text-purple-600 mb-8">櫃檯 C</h2>
                <div id="display-counter-C" class="text-[10rem] leading-none font-black text-gray-800">--</div>
            </div>
        </div>
        <div class="bg-yellow-100 p-6 text-center text-4xl font-bold border-t-4 border-yellow-400">
            下一位準備：<span id="display-next-inline" class="text-blue-600">--</span>
        </div>
        <div class="marquee-container">
            <span class="marquee-text">⚠️ 請各位家長到達禮堂後，務必先到【簽到處】點名，才會進行叫號程序。未簽到者將不會叫號！</span>
        </div>
    </div>

    <!-- 📝 簽到處版面 (維持不變) -->
    <div id="reception-view" class="hidden p-6 relative">
        <button onclick="location.reload()" class="absolute top-4 right-4 bg-gray-300 px-4 py-2 rounded">返回</button>
        <h2 class="text-3xl font-bold mb-4">📝 接待處簽到 (<span class="sys-date-label"></span>)</h2>
        <div class="flex gap-4 mb-6">
            <input type="text" id="search-input" placeholder="搜尋籌號、班別或姓名..." class="p-3 w-1/3 border rounded text-lg">
            <button onclick="openWalkInModal()" class="bg-red-500 text-white px-6 rounded text-lg font-bold">➕ 現場突發 (Walk-in)</button>
        </div>
        <div class="bg-white rounded shadow h-[70vh] overflow-y-auto">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-gray-200">
                    <tr>
                        <th class="p-3 border">籌號</th>
                        <th class="p-3 border">班別</th>
                        <th class="p-3 border">姓名</th>
                        <th class="p-3 border">預計時段</th>
                        <th class="p-3 border">狀態</th>
                        <th class="p-3 border">操作</th>
                    </tr>
                </thead>
                <tbody id="reception-list"></tbody>
            </table>
        </div>
    </div>

    <!-- 新增/編輯 彈出視窗 -->
    <div id="edit-modal" class="hidden fixed inset-0 flex items-center justify-center z-50 modal-bg">
        <div class="bg-white p-6 rounded shadow-xl w-96">
            <h3 id="modal-title" class="text-2xl font-bold mb-4 text-blue-800">編輯資料</h3>
            <div class="mb-3">
                <label class="block text-sm font-bold text-gray-700">籌號</label>
                <input type="text" id="modal-ticket-id" class="w-full p-2 border rounded bg-gray-100" readonly>
            </div>
            <div class="mb-3">
                <label class="block text-sm font-bold text-gray-700">班別</label>
                <input type="text" id="modal-class" class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-bold text-gray-700">學生姓名</label>
                <input type="text" id="modal-name" class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label class="block text-sm font-bold text-gray-700">分流櫃檯 (A/B/C/Walk-in)</label>
                <input type="text" id="modal-counter" class="w-full p-2 border rounded">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700">電話號碼</label>
                <input type="text" id="modal-phone" class="w-full p-2 border rounded">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="bg-gray-300 px-4 py-2 rounded">取消</button>
                <button id="btn-modal-submit" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">儲存</button>
            </div>
        </div>
    </div>

    <!-- 櫃檯版面 -->
    <div id="counter-view" class="hidden flex col items-center justify-center h-full relative">
        <button onclick="location.reload()" class="absolute top-4 left-4 bg-gray-300 px-4 py-2 rounded">返回</button>
        <div class="text-center">
            <h2 class="text-6xl font-bold mb-4">你是：櫃檯 <span id="counter-id-label" class="text-purple-600">X</span></h2>
            <p class="text-2xl mb-8">目前服務：<span id="counter-current-ticket" class="font-bold text-blue-600 text-5xl">無</span></p>
            <button id="btn-call-next" class="bg-purple-600 text-white font-bold text-5xl py-12 px-24 rounded-2xl shadow-xl hover:bg-purple-700 active:scale-95 transition">
                呼叫下一位<br><span class="text-xl font-normal">(優先本區，無人則跨區)</span>
            </button>
        </div>
    </div>

    <!-- ⚙️ 後台管理版面 -->
    <div id="admin-view" class="hidden p-6 relative">
        <button onclick="location.reload()" class="absolute top-4 right-4 bg-gray-300 px-4 py-2 rounded">返回</button>
        <h2 class="text-3xl font-bold mb-4 text-gray-800">⚙️ 後台管理中心 (<span class="sys-date-label"></span>)</h2>
        
        <div class="bg-white p-6 rounded shadow mb-6 border-l-4 border-blue-500 flex justify-between items-start">
            <div>
                <h3 class="text-xl font-bold mb-2">1. 匯入 / 匯出資料</h3>
                <p class="text-gray-600 mb-4">請將 Excel 存為 <strong>CSV (UTF-8)</strong> 後上傳。匯入會覆蓋現有相同日期的資料。</p>
                <input type="file" id="csv-upload" accept=".csv" class="mb-4"><br>
                <button id="btn-import-csv" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold mr-2">上傳並匯入</button>
                <button id="btn-export-csv" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold">📥 匯出當日名單 (含簽到紀錄)</button>
                <span id="import-status" class="ml-4 text-green-600 font-bold block mt-2"></span>
            </div>
            <div>
                <button id="btn-clear-db" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-4 rounded-lg shadow-md transition">
                    ⚠️ 清空今日雲端資料
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded shadow border-l-4 border-red-500">
            <h3 class="text-xl font-bold mb-2 text-red-600">未到達家長名單 (提早致電)</h3>
            <p class="mb-2">統計：共 <span id="missing-count" class="font-bold">0</span> 人未簽到</p>
            <div class="h-64 overflow-y-auto border p-2">
                <table class="w-full text-left">
                    <thead><tr class="bg-gray-100"><th>籌號</th><th>姓名</th><th>電話</th><th>班別</th><th>預計時段</th></tr></thead>
                    <tbody id="admin-missing-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDa5qGUai--g_smRHNijk0jW2iXz1xUbrI",
            authDomain: "school-ipad-2026.firebaseapp.com",
            databaseURL: "https://school-ipad-2026-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "school-ipad-2026",
            storageBucket: "school-ipad-2026.firebasestorage.app",
            messagingSenderId: "148142522622",
            appId: "1:148142522622:web:913a0e14c5b6c39a17a5af"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let sessionDate = "";
        let sessionCounter = "";
        let localTickets = {};

        window.enterSystem = function(role, counterId = '') {
            sessionDate = document.getElementById('date-select').value;
            sessionCounter = counterId;

            document.getElementById('login-view').classList.add('hidden');
            let dateText = sessionDate === 'day1' ? 'Day 1 (17/9)' : 'Day 2 (18/9)';
            document.querySelectorAll('.sys-date-label').forEach(el => el.innerText = dateText);
            
            if (role === 'display') { document.getElementById('display-view').classList.remove('hidden'); initDisplay(); }
            else if (role === 'reception') { document.getElementById('reception-view').classList.remove('hidden'); initReception(); }
            else if (role === 'counter') { document.getElementById('counter-view').classList.remove('hidden'); document.getElementById('counter-id-label').innerText = counterId; initCounter(); }
            else if (role === 'admin') { document.getElementById('admin-view').classList.remove('hidden'); initAdmin(); }
        }

        // ==============================
        // ⚙️ 後台管理邏輯 (Admin) - 含匯出功能
        // ==============================
        function initAdmin() {
            // 匯入 CSV
            document.getElementById('btn-import-csv').addEventListener('click', () => {
                const file = document.getElementById('csv-upload').files[0];
                if (!file) return alert('請先選擇檔案');
                Papa.parse(file, {
                    header: true, skipEmptyLines: true,
                    complete: function(results) {
                        let data = results.data;
                        let updates = {}; let day1Count = 0, day2Count = 0;
                        data.forEach(row => {
                            if (!row['分流'] || !row['籌號']) return;
                            let ticketId = row['分流'] + row['籌號'];
                            let targetDay = row['日期'] == '17' ? 'day1' : (row['日期'] == '18' ? 'day2' : null);
                            if (targetDay) {
                                let ticketData = {
                                    displayTicket: ticketId,
                                    studentClass: row['班別'], studentId: row['學號'] || '', name: row['學生姓名'] || '',
                                    originalCounter: row['分流'], timeSlot: row['預計時段'] || '未設定',
                                    status: 'pending', signInTime: 0, loginId: row['登入編號'] || '', phone: row['電話號碼'] || ''
                                };
                                updates[`${targetDay}/tickets/${ticketId}`] = ticketData;
                                targetDay === 'day1' ? day1Count++ : day2Count++;
                            }
                        });
                        update(ref(db), updates).then(() => {
                            document.getElementById('import-status').innerText = `匯入成功！Day1: ${day1Count}筆, Day2: ${day2Count}筆`;
                        });
                    }
                });
            });

            // 📥 匯出當日報表 (CSV)
            document.getElementById('btn-export-csv').addEventListener('click', async () => {
                const snapshot = await get(ref(db, `${sessionDate}/tickets`));
                const data = snapshot.val() || {};
                
                // 整理資料陣列
                const records = Object.values(data).map(t => {
                    let statusZh = '未到達';
                    if(t.status === 'signed_in') statusZh = '已簽到等待中';
                    if(t.status === 'called') statusZh = '已叫號(處理完畢)';
                    
                    let signTime = '';
                    if(t.signInTime > 0) {
                        let d = new Date(t.signInTime);
                        signTime = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
                    }

                    return {
                        "籌號": t.displayTicket,
                        "班別": t.studentClass,
                        "學號": t.studentId || '',
                        "學生姓名": t.name,
                        "電話號碼": t.phone || '',
                        "原定櫃檯": t.originalCounter,
                        "預計時段": t.timeSlot,
                        "狀態": statusZh,
                        "簽到時間": signTime
                    };
                });

                if (records.length === 0) return alert('目前沒有資料可匯出');

                // 加入 BOM，確保 Excel 打開中文不會亂碼
                let csvContent = "\uFEFF" + Papa.unparse(records);
                let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                
                // 觸發下載
                let link = document.createElement("a");
                let url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `iPad訂購名單_${sessionDate === 'day1' ? '17Sep' : '18Sep'}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });

            // 清空資料
            document.getElementById('btn-clear-db').addEventListener('click', () => {
                let dateName = sessionDate === 'day1' ? '9月17日' : '9月18日';
                if (confirm(`⚠️ 警告：確定要【清空】 ${dateName} 的所有雲端資料與叫號紀錄嗎？`)) {
                    remove(ref(db, sessionDate)).then(() => alert('當日資料已成功全部清空。'));
                }
            });

            // 監聽未到達名單
            onValue(ref(db, `${sessionDate}/tickets`), (snapshot) => {
                let missingHTML = ''; let count = 0;
                snapshot.forEach(child => {
                    let t = child.val();
                    if (t.status === 'pending') {
                        missingHTML += `<tr><td class="border p-1 font-bold">${t.displayTicket}</td><td class="border p-1">${t.name}</td><td class="border p-1">${t.phone || '-'}</td><td class="border p-1">${t.studentClass}</td><td class="border p-1">${t.timeSlot}</td></tr>`;
                        count++;
                    }
                });
                document.getElementById('admin-missing-list').innerHTML = missingHTML;
                document.getElementById('missing-count').innerText = count;
            });
        }

        // ==============================
        // 📝 簽到處邏輯 (Reception)
        // ==============================
        function initReception() {
            onValue(ref(db, `${sessionDate}/tickets`), (snapshot) => {
                localTickets = snapshot.val() || {};
                renderReceptionList();
            });
            document.getElementById('search-input').addEventListener('input', renderReceptionList);
        }

        function renderReceptionList() {
            let filterText = document.getElementById('search-input').value.toLowerCase();
            let html = '';
            
            let arr = Object.values(localTickets).filter(t => 
                t.displayTicket.toLowerCase().includes(filterText) || 
                t.name.toLowerCase().includes(filterText) || 
                t.studentClass.toLowerCase().includes(filterText)
            ).sort((a, b) => {
                if (a.status === b.status) return 0;
                return a.status === 'signed_in' ? -1 : 1;
            });

            arr.forEach(t => {
                let statusText = ''; let actionButtons = '';
                if (t.status === 'pending') {
                    statusText = '<span class="text-red-500 font-bold">🔴 未到達</span>';
                    actionButtons = `<button onclick="signIn('${t.displayTicket}')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded mr-2">簽到</button>`;
                } else if (t.status === 'signed_in') {
                    statusText = '<span class="text-green-600 font-bold">🟢 已簽到等待</span>';
                    actionButtons = `<button onclick="unSignIn('${t.displayTicket}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded mr-2 text-xs">取消簽到</button>`;
                } else {
                    statusText = '<span class="text-gray-400">⚪ 已叫號完成</span>';
                }

                actionButtons += `
                    <button onclick="openEditModal('${t.displayTicket}')" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded mr-2 text-xs">修改</button>
                    <button onclick="deleteTicket('${t.displayTicket}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">刪除</button>
                `;

                html += `<tr class="border-b hover:bg-gray-50">
                    <td class="p-3 font-bold text-lg">${t.displayTicket}</td>
                    <td class="p-3">${t.studentClass}</td>
                    <td class="p-3">${t.name}</td>
                    <td class="p-3">${t.timeSlot}</td>
                    <td class="p-3">${statusText}</td>
                    <td class="p-3 flex items-center">${actionButtons}</td>
                </tr>`;
            });
            document.getElementById('reception-list').innerHTML = html;
        }

        window.signIn = function(ticketId) { update(ref(db, `${sessionDate}/tickets/${ticketId}`), { status: 'signed_in', signInTime: Date.now() }); }
        window.unSignIn = function(ticketId) { update(ref(db, `${sessionDate}/tickets/${ticketId}`), { status: 'pending', signInTime: 0 }); }

        window.openWalkInModal = function() {
            document.getElementById('modal-title').innerText = "➕ 新增 Walk-in 籌號";
            let walkinCount = Object.keys(localTickets).filter(k => k.startsWith('W')).length;
            document.getElementById('modal-ticket-id').value = 'W' + (walkinCount + 1);
            document.getElementById('modal-class').value = ""; document.getElementById('modal-name').value = "";
            document.getElementById('modal-counter').value = "Walk-in"; document.getElementById('modal-phone').value = "";
            document.getElementById('btn-modal-submit').onclick = submitWalkIn;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        window.openEditModal = function(ticketId) {
            document.getElementById('modal-title').innerText = `✏️ 修改資料 - ${ticketId}`;
            let t = localTickets[ticketId];
            document.getElementById('modal-ticket-id').value = ticketId;
            document.getElementById('modal-class').value = t.studentClass || '';
            document.getElementById('modal-name').value = t.name || '';
            document.getElementById('modal-counter').value = t.originalCounter || '';
            document.getElementById('modal-phone').value = t.phone || '';
            document.getElementById('btn-modal-submit').onclick = () => submitEdit(ticketId);
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        window.closeModal = function() { document.getElementById('edit-modal').classList.add('hidden'); }

        function submitWalkIn() {
            let id = document.getElementById('modal-ticket-id').value; let cls = document.getElementById('modal-class').value;
            let name = document.getElementById('modal-name').value; let counter = document.getElementById('modal-counter').value; let phone = document.getElementById('modal-phone').value;
            if(!cls || !name) return alert('班別與姓名為必填！');
            set(ref(db, `${sessionDate}/tickets/${id}`), {
                displayTicket: id, studentClass: cls, name: name, originalCounter: counter, timeSlot: '現場',
                status: 'signed_in', signInTime: Date.now(), phone: phone
            }).then(() => { closeModal(); alert(`成功新增 Walk-in：${id}，且已簽到！`); });
        }

        function submitEdit(ticketId) {
            let cls = document.getElementById('modal-class').value; let name = document.getElementById('modal-name').value;
            let counter = document.getElementById('modal-counter').value; let phone = document.getElementById('modal-phone').value;
            if(!cls || !name) return alert('班別與姓名為必填！');
            update(ref(db, `${sessionDate}/tickets/${ticketId}`), { studentClass: cls, name: name, originalCounter: counter, phone: phone }).then(() => closeModal());
        }

        window.deleteTicket = function(ticketId) {
            if (confirm(`⚠️ 確定要刪除籌號【${ticketId}】嗎？`)) {
                remove(ref(db, `${sessionDate}/tickets/${ticketId}`)).then(() => alert(`籌號 ${ticketId} 已刪除。`));
            }
        }

        // ==============================
        // 櫃檯與大螢幕邏輯 (含語音 TTS)
        // ==============================
        function initCounter() {
            onValue(ref(db, `${sessionDate}/currentCalls/${sessionCounter}`), (snapshot) => {
                document.getElementById('counter-current-ticket').innerText = snapshot.val() || '無';
            });

            document.getElementById('btn-call-next').addEventListener('click', async () => {
                const snapshot = await get(ref(db, `${sessionDate}/tickets`));
                let tickets = snapshot.val() || {};
                let waiting = Object.values(tickets).filter(t => t.status === 'signed_in');
                if (waiting.length === 0) return alert('目前沒有已簽到的家長！');

                let myQueue = waiting.filter(t => t.originalCounter === sessionCounter);
                let nextTicket = null;

                if (myQueue.length > 0) {
                    myQueue.sort((a, b) => a.signInTime - b.signInTime);
                    nextTicket = myQueue[0];
                } else {
                    waiting.sort((a, b) => a.signInTime - b.signInTime);
                    nextTicket = waiting[0];
                }

                let updates = {};
                updates[`${sessionDate}/tickets/${nextTicket.displayTicket}/status`] = 'called';
                updates[`${sessionDate}/currentCalls/${sessionCounter}`] = nextTicket.displayTicket;
                update(ref(db), updates);
            });
        }

        // 語音播放函數
        window.testAudio = function() {
            playVoice("這是一個語音測試，準備開始叫號");
        };

        function playVoice(text) {
            if ('speechSynthesis' in window) {
                // 先停止可能還在播放的聲音
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-HK'; // 設定為香港廣東話
                msg.rate = 0.9;     // 稍微放慢速度，讓家長聽得清楚
                msg.pitch = 1;
                window.speechSynthesis.speak(msg);
            }
        }

        function initDisplay() {
            let previousCalls = { A: '', B: '', C: '' };
            let isFirstLoad = true;

            onValue(ref(db, `${sessionDate}/currentCalls`), (snapshot) => {
                let calls = snapshot.val() || {};
                
                // 檢查是否有新的叫號，並觸發語音 (排除第一次載入時)
                if (!isFirstLoad) {
                    ['A', 'B', 'C'].forEach(counter => {
                        let newTicket = calls[counter];
                        if (newTicket && newTicket !== previousCalls[counter] && newTicket !== '--') {
                            // 延遲一點播放，避免畫面還沒轉聲音先出
                            setTimeout(() => {
                                // 將號碼拆開唸會比較清楚，例如 A 1 唸成 "A" "一"
                                let speakText = newTicket.replace(/([a-zA-Z])(\d+)/, "$1 $2");
                                playVoice(`請 ${speakText} 號家長，前往櫃檯 ${counter}`);
                            }, 500);
                        }
                    });
                }

                // 更新畫面
                document.getElementById('display-counter-A').innerText = calls.A || '--';
                document.getElementById('display-counter-B').innerText = calls.B || '--';
                document.getElementById('display-counter-C').innerText = calls.C || '--';

                // 記錄這次的狀態，留給下次比對
                previousCalls = { A: calls.A || '--', B: calls.B || '--', C: calls.C || '--' };
                isFirstLoad = false;
            });

            onValue(ref(db, `${sessionDate}/tickets`), (snapshot) => {
                let tickets = snapshot.val() || {};
                let waiting = Object.values(tickets).filter(t => t.status === 'signed_in').sort((a, b) => a.signInTime - b.signInTime);
                document.getElementById('display-next-inline').innerText = waiting.length > 0 ? waiting[0].displayTicket : '--';
            });
        }
    </script>
</body>
</html>
